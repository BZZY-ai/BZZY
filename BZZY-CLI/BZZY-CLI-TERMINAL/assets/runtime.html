<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>bzzy session</title>
<style>body{background:#151710;color:#ecefe3;font:15px system-ui;margin:0}header,footer{position:fixed;left:0;right:0;background:#25291b;padding:14px;z-index:1}header{position:sticky;top:0;overflow-wrap:anywhere}footer{bottom:0}main{max-width:1000px;margin:0 auto 190px;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px ui-monospace,monospace}button,input,select{font:inherit;padding:8px;background:#343a26;color:inherit;border:1px solid #85915e;border-radius:5px}input{width:55%}button{cursor:pointer}button[aria-pressed="true"]{background:#b2c978;color:#151710}#agent-tabs{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}#status{color:#c5d889}#question{white-space:pre-wrap}small{display:block;margin-top:6px;color:#c5d889}</style>
<header><strong>bzzy 🐝</strong> <select id="sessions"><option>Select a conversation</option></select> <button id="refresh">Refresh</button><small id="session">Session: —</small><small id="status">Read-only viewer</small></header>
<main><nav><button data-panel="chat-panel">Conversation</button> <button data-panel="activity-panel">Live activity</button> <button data-panel="traffic-panel">HTTP traffic</button></nav>
<section id="chat-panel"><div id="agent-tabs"></div><pre id="history"></pre><p id="question"></p></section>
<section id="activity-panel" hidden><h2>Live activity</h2><p>Agent summaries and details; observations and inferences retain their labels.</p><div id="activities"></div></section>
<section id="traffic-panel" hidden><h2>Observed HTTP traffic</h2><p id="coverage">Host-tool requests are recorded. Optional proxy capture covers proxy-aware child processes.</p><div id="traffic"></div></section></main>
<footer><button id="claim">Attach / take input ownership</button> <button id="pause">Pause</button> <button id="cancel">Cancel</button><form id="chat"><input id="message" placeholder="Attach to chat or answer a pending question" autocomplete="off"><button>Send</button></form><small id="error"></small></footer><script src="/app.js"></script></html>
