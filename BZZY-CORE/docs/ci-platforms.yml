# Template: copy to .github/workflows/core-platforms.yml at the repository root.
# Core and Relay source must both be present in checkout. CLI is not required.
name: Core host platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
    defaults:
      run:
        working-directory: BZZY-CORE
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record host and runtime
        run: |
          node -p 'JSON.stringify({platform: process.platform, arch: process.arch, node: process.version})'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  debian:
    name: Core (${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['node:24-bookworm-slim', 'node:24-trixie-slim']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the locked Relay SDK
        working-directory: BZZY-CORE
        run: npm ci --ignore-scripts
      - name: Check and test Debian userspace as a non-root user
        env:
          CORE_TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/BZZY-CORE,target=/workspace/BZZY-CORE,readonly" \
            --workdir /workspace/BZZY-CORE \
            "$CORE_TEST_IMAGE" \
            sh -c 'node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})" && node scripts/check.mjs && node --test test/*.test.js'
