# /etc/systemd/system/caddy.service.d/bzzy-security.conf
# Add { admin unix//run/caddy/admin.sock } to the Caddyfile global block.
[Service]
MemoryMax=256M
TasksMax=64
LimitCORE=0
LogNamespace=bzzy-relay
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --address unix//run/caddy/admin.sock --force
